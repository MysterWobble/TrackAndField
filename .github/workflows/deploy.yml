# Puts the game online at https://mysterwobble.github.io/TrackAndField/
# Every time main changes: install, run the tests (nothing goes live if they fail), build, and publish.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # a "Run workflow" button on GitHub, to redeploy by hand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
