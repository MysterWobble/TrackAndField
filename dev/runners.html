<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runner viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(ellipse at 50% 45%, #efe6d0 0%, #e3d5b8 60%, #cdbb98 100%);
        font: 600 14px system-ui, sans-serif;
        color: #22304a;
      }
      canvas {
        display: block;
      }
      #help {
        position: fixed;
        left: 12px;
        top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="help">Runner viewer (dev tool). Keys: 1 = jog, 2 = cruise, 3 = kick, 0 = stand. Drag to turn, scroll to zoom.</div>
    <script type="module">
      // A close-up of all the runners, for working on web/runnerModel.js. Open /dev/runners.html on the dev server.
      import * as THREE from "three";
      import { COLORS, RUNNER_LOOKS } from "../web/colors.js";
      import { buildRunnerModel, hairStyleFor } from "../web/runnerModel.js";

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NeutralToneMapping;
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      scene.add(new THREE.HemisphereLight(0xf3e7cc, 0x8a7a55, 1.5));
      const sun = new THREE.DirectionalLight(COLORS.sun, 2.0);
      sun.position.set(-1, 1.1, 0.6).multiplyScalar(50);
      scene.add(sun);
      const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);

      const shirts = [COLORS.you, ...COLORS.kits];
      const stage = new THREE.Group();
      scene.add(stage);
      const runners = shirts.map((shirt, i) => {
        const model = buildRunnerModel({
          colors: {
            shirt,
            shorts: new THREE.Color(shirt).multiplyScalar(0.72).getHex(),
            skin: RUNNER_LOOKS.skin[(i * 3) % RUNNER_LOOKS.skin.length],
            hair: RUNNER_LOOKS.hair[(i * 2) % RUNNER_LOOKS.hair.length],
            shoes: RUNNER_LOOKS.shoes[i % RUNNER_LOOKS.shoes.length],
            bib: RUNNER_LOOKS.bib,
          },
          hairStyle: hairStyleFor(i),
        });
        model.group.position.set(0, 0, (i - (shirts.length - 1) / 2) * 0.75);
        stage.add(model.group);
        return model;
      });
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(4, 8), new THREE.MeshLambertMaterial({ color: 0xc8544a }));
      ground.rotation.x = -Math.PI / 2;
      stage.add(ground);

      let pace = 1;
      let pushing = false;
      addEventListener("keydown", (e) => {
        if (e.key === "0") [pace, pushing] = [0, false];
        if (e.key === "1") [pace, pushing] = [0.7, false];
        if (e.key === "2") [pace, pushing] = [1, false];
        if (e.key === "3") [pace, pushing] = [1.2, true];
      });
      let turn = 0.6;
      let distance = 9;
      addEventListener("wheel", (e) => (distance = Math.min(14, Math.max(2, distance * (e.deltaY > 0 ? 1.1 : 0.9)))));
      let dragging = null;
      addEventListener("pointerdown", (e) => (dragging = e.clientX));
      addEventListener("pointerup", () => (dragging = null));
      addEventListener("pointermove", (e) => {
        if (dragging === null) return;
        turn += (e.clientX - dragging) * 0.01;
        dragging = e.clientX;
      });

      function resize() {
        renderer.setSize(innerWidth, innerHeight);
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
      }
      addEventListener("resize", resize);
      resize();

      let last = performance.now();
      renderer.setAnimationLoop((now) => {
        const dt = Math.min(0.1, (now - last) / 1000);
        last = now;
        for (const r of runners) r.animate(dt, pace, pushing);
        stage.rotation.y = turn;
        camera.position.set(Math.cos(0.5) * distance, 0.6 + distance * 0.22, Math.sin(0.5) * distance);
        camera.lookAt(0, distance < 5 ? 1.3 : 0.9, 0);
        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
